[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drafting"
version = "0.1.0"
description = "Orthographic drawing sheets from CadQuery solids"
requires-python = ">=3.10"
# Provided by the host project's environment. Installed with --no-deps so that
# adding this package cannot disturb a project's pinned CadQuery.
dependencies = ["cadquery>=2.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/drafting"]
